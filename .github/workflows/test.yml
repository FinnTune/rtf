name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Pinned to match the Node version the eventual webapp Docker build
          # stage will use (Vite requires Node ^20.19 or >=22.12 — 22 keeps
          # both environments on the same major version deliberately).
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Install webapp (React) dependencies
        working-directory: webapp
        run: npm ci

      - name: Lint webapp
        working-directory: webapp
        run: npm run lint

      - name: Typecheck webapp
        working-directory: webapp
        run: npm run typecheck

      - name: Test webapp
        working-directory: webapp
        run: npm run test

      - name: Build webapp
        working-directory: webapp
        run: npm run build

      - name: Run Go tests
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: -Wno-discarded-qualifiers
        run: go test ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan Go dependencies for known vulnerabilities
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: -Wno-discarded-qualifiers
        run: govulncheck ./...
